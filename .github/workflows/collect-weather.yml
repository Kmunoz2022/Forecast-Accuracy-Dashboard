name: Collect daily weather data

on:
  schedule:
    # 12:17 UTC avoids GitHub's busiest scheduling boundary and is early
    # morning at every configured US station.
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: Replace an existing forecast snapshot for the current UTC day
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-weather-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: python -m pip install "tzdata>=2025.2"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Collect forecasts
        id: forecasts
        continue-on-error: true
        shell: bash
        env:
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
          WEATHERBIT_API_KEY: ${{ secrets.WEATHERBIT_API_KEY }}
          WEATHERBIT_ARCHIVAL_ALLOWED: ${{ vars.WEATHERBIT_ARCHIVAL_ALLOWED }}
          TOMORROW_API_KEYS: ${{ secrets.TOMORROW_API_KEYS }}
          TOMORROW_ARCHIVAL_ALLOWED: ${{ vars.TOMORROW_ARCHIVAL_ALLOWED }}
          # These are intentionally not passed to the collector because their
          # standard forecast terms limit retention to 24 hours:
          # GOOGLE_MAPS_DEMO_API_KEY
          # WEATHERAPI_API_KEY
        run: |
          args=()
          if [[ "${{ inputs.refresh }}" == "true" ]]; then
            args+=(--refresh)
          fi
          python src/collect_forecasts.py "${args[@]}"

      - name: Collect observations
        id: observations
        continue-on-error: true
        run: python src/collect_observations.py

      - name: Commit collected data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data to commit."
            exit 0
          fi
          git commit -m "data: collect weather snapshots $(date -u +%F) [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Report collection failure
        if: steps.forecasts.outcome == 'failure' || steps.observations.outcome == 'failure'
        shell: bash
        run: |
          echo "One or more collectors failed after saving any successful responses."
          exit 1
