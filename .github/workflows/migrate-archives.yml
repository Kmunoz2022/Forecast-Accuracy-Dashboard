name: Migrate encrypted forecast archives

on:
  push:
    branches: [main]
    paths:
      - src/migrate_archives.py
      - src/weather_pipeline/encryption.py
      - .github/workflows/migrate-archives.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-weather-collection
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collection.txt
      - run: python -m pip install -r requirements-collection.txt
      - name: Verify and migrate permitted archives
        env:
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          VISUALCROSSING_API_KEY: ${{ secrets.VISUALCROSSING_API_KEY }}
        run: python src/migrate_archives.py --apply
      - name: Rebuild verification reports
        env:
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          VISUALCROSSING_API_KEY: ${{ secrets.VISUALCROSSING_API_KEY }}
        run: |
          python src/report_collection.py --out-dir data/verification/daily --github-summary
          python src/report_collection.py --out-dir data/verification/market
      - name: Commit encrypted archives
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Archives are already migrated."
            exit 0
          fi
          git commit -m "data: migrate permitted forecast archives [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
